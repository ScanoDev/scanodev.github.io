<!DOCTYPE html>
<html lang="en">

</head>

      <p class="sub" id="prof-sub"></p>
      <div class="grid" id="prof-grid"></div>

    <section>
      <h2 id="pers-title"></h2>
      <p class="sub" id="pers-sub"></p>
      <div class="grid" id="pers-grid"></div>

    <footer id="footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>

</html>
